name: Windows

on:
  pull_request:
    paths: [windows/**, shared/**, .github/workflows/windows.yml]
  push:
    branches: [main]
    paths: [windows/**, shared/**, .github/workflows/windows.yml]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # rustup (>= 1.28) reads windows/rust-toolchain.toml, so CI and local builds use the same Rust.
      # `rustup show` only reports the toolchain, so install it explicitly.
      - name: Install Rust toolchain
        working-directory: windows
        run: rustup toolchain install

      # Keyed on Cargo.lock and the toolchain; target/ lives in windows/ because the workspace is there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: windows -> target

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: windows/app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: windows/app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: windows/app
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: windows/app
        run: pnpm typecheck

      - name: Lint
        working-directory: windows/app
        run: pnpm lint

      - name: Rust format
        working-directory: windows
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: windows
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: windows
        run: cargo test --workspace --locked

      # The model is about 670 MB; the cache key changes only when a pin changes.
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/shepit-models
          key: parakeet-v3-int8-${{ hashFiles('windows/engine/src/pins.rs') }}

      - name: Transcribe the fixture clips
        working-directory: windows
        env:
          SHEPIT_MODELS_DIR: ${{ runner.temp }}/shepit-models
        run: cargo test -p shepit-engine --release --locked --test transcribe_fixture -- --ignored --nocapture

      # ONNX Runtime may ship DLLs next to the exe; the installer has to carry them.
      - name: List runtime DLLs
        shell: bash
        run: ls -l windows/target/release/*.dll || echo "no DLLs"

      # Builds the installer too, so a broken bundle fails here and not at release time.
      - name: Build the app and installer
        working-directory: windows/app
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: shepit-windows-installer
          path: windows/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
