name: Release

# Push a tag like v0.3.0 on main. The tag must match CFBundleShortVersionString in project.yml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against project.yml
        id: version
        run: |
          version=$(sed -n 's/.*CFBundleShortVersionString: "\(.*\)"/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Reads the build cache CI saves on main (see ci.yml); a tag run never writes one.
      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Restore builds
        uses: actions/cache/restore@v4
        with:
          path: |
            Packages/ShepitCore/.build
            .build/DerivedData
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Packages/ShepitCore/Package.resolved') }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      - name: Build and zip
        run: make package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" ".build/dist/Shepit-$VERSION.zip" \
            --title "Shepit $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
