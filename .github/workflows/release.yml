name: Release

# Push a tag like v0.3.0 on main. The tag must match CFBundleShortVersionString in project.yml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against project.yml
        id: version
        run: |
          version=$(sed -n 's/.*CFBundleShortVersionString: "\(.*\)"/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      - name: Build and zip
        run: make package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" ".build/dist/Shepit-$VERSION.zip" \
            --title "Shepit $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
