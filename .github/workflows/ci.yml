name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Dependencies (WhisperKit, FluidAudio, GRDB) take most of the build time. Restoring both build
      # directories lets SwiftPM and Xcode skip them; the key changes with the Xcode version and the
      # resolved packages, because objects from another Xcode or another package version are useless.
      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache builds
        uses: actions/cache@v4
        with:
          path: |
            Packages/ShepitCore/.build
            .build/DerivedData
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Packages/ShepitCore/Package.resolved') }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      - name: Build the app
        run: make build
