name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Dependencies (WhisperKit, FluidAudio, GRDB) take most of the build time. Restoring both build
      # directories lets SwiftPM and Xcode skip them; the key changes with the Xcode version and the
      # resolved packages, because objects from another Xcode or another package version are useless.
      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Only main saves the cache. Each saved copy is about 2.3 GB against GitHub's 10 GB per repo, so
      # caches saved by pull requests would push main's out.
      - name: Restore builds
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            Packages/ShepitCore/.build
            .build/DerivedData
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Packages/ShepitCore/Package.resolved') }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      # Builds the disk image too, so a broken package fails here and not after the release tag is pushed.
      - name: Build the app and disk image
        run: make package

      - name: Save builds
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Packages/ShepitCore/.build
            .build/DerivedData
          key: ${{ steps.restore.outputs.cache-primary-key }}
