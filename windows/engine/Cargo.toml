[package]
name = "shepit-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dirs = "=7.0.0"
sha2 = "=0.11.1"
# transcribe-rs 0.3.12 requires ort "2.0.0-rc.12" but only builds against exactly that release (rc.15
# changed Session::builder). The exact pin keeps a lock refresh from drifting. Same default features
# transcribe-rs asks for, so no second ort build.
ort = "=2.0.0-rc.12"
transcribe-rs = { version = "=0.3.12", default-features = false, features = ["onnx"] }
ureq = "=3.5.0"

[dev-dependencies]
hound = "=3.5.1"
serde_json = "=1.0.154"
shepit-core = { path = "../core" }
tempfile = "=3.27.0"
