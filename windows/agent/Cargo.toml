[package]
name = "shepit-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
shepit-core = { path = "../core" }
serde_json = "=1.0.154"
dirs = "=7.0.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "shepit-fake-agent"
path = "src/bin/shepit-fake-agent.rs"

[dev-dependencies]
tempfile = "=3.27.0"
