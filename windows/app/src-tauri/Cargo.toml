[package]
name = "shepit-app"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
shepit-core = { path = "../../core" }
shepit-engine = { path = "../../engine" }
cpal = "=0.18.2"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
