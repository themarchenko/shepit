[package]
name = "shepit-app"
version = "0.3.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
shepit-core = { path = "../../core" }
shepit-engine = { path = "../../engine" }
shepit-agent = { path = "../../agent" }
cpal = "=0.18.2"
serde = { version = "=1.0.229", features = ["derive"] }
# tauri.conf.json carries a plugins section, and generate_context! expands to serde_json calls;
# update_settings also takes a JSON patch.
serde_json = "=1.0.154"
# History (docs/spec/history.md): the same schema as the macOS app. `bundled` builds SQLite with the crate.
rusqlite = { version = "=0.41.0", features = ["bundled"] }

[dev-dependencies]
# The functional updater tests build a mock app; the feature is test-only.
tauri = { version = "=2.12.5", features = ["tray-icon", "test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
